name: Linux Qt Quick
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Qt and platform development packages
        run: dnf install -y git cmake gcc-c++ pkgconf-pkg-config libxcb-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel layer-shell-qt-devel
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Capture native QML surface
        run: QT_QUICK_BACKEND=software ./build/xdock -platform offscreen --capture build/classic-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native-render
          path: build/classic-linux.png
